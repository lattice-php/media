name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AWS_ACCESS_KEY_ID: herd
  AWS_SECRET_ACCESS_KEY: secretkey
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: lattice
  AWS_ENDPOINT: http://localhost:9000
  AWS_URL: http://localhost:9000/lattice
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

jobs:
  php:
    name: PHP ${{ matrix.php-version }} (${{ matrix.php-version == '8.4' && 'pint, phpstan, pest' || 'pest' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v6

      - name: Start RustFS (S3-compatible)
        run: |
          docker run -d --name rustfs \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=herd \
            -e RUSTFS_SECRET_KEY=secretkey \
            -e RUSTFS_CORS_ALLOWED_ORIGINS=* \
            rustfs/rustfs:latest /data
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:9000/; then
              echo "RustFS is up"; exit 0
            fi
            echo "waiting for RustFS ($i)..."; sleep 1
          done
          echo "RustFS did not become ready"; docker logs rustfs; exit 1

      - name: Create RustFS bucket
        run: |
          aws configure set default.s3.addressing_style path
          aws --endpoint-url "$AWS_ENDPOINT" s3 mb "s3://${AWS_BUCKET}"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php-version }}-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Pint, PHPStan, Pest
        if: ${{ matrix.php-version == '8.4' }}
        run: composer check

      - name: Pest
        if: ${{ matrix.php-version != '8.4' }}
        run: composer test

  js:
    name: JS (typecheck, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  browser:
    name: Browser (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start RustFS (S3-compatible)
        run: |
          docker run -d --name rustfs \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=herd \
            -e RUSTFS_SECRET_KEY=secretkey \
            -e RUSTFS_CORS_ALLOWED_ORIGINS=* \
            rustfs/rustfs:latest /data
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:9000/; then
              echo "RustFS is up"; exit 0
            fi
            echo "waiting for RustFS ($i)..."; sleep 1
          done
          echo "RustFS did not become ready"; docker logs rustfs; exit 1

      - name: Create RustFS bucket
        run: |
          aws configure set default.s3.addressing_style path
          aws --endpoint-url "$AWS_ENDPOINT" s3 mb "s3://${AWS_BUCKET}"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-8.4-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-8.4-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser and system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: composer test:browser

      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
