laravel: '@testbench'

env:
  - DB_CONNECTION=sqlite
  - AWS_ACCESS_KEY_ID=herd
  - AWS_SECRET_ACCESS_KEY=secretkey
  - AWS_DEFAULT_REGION=us-east-1
  - AWS_BUCKET=lattice
  - AWS_ENDPOINT=https://rustfs.herd.test
  - AWS_URL=https://rustfs.herd.test/lattice
  - AWS_USE_PATH_STYLE_ENDPOINT=true

migrations:
  - workbench/database/migrations

workbench:
  start: '/media'
  welcome: false
  build:
    - create-sqlite-db
    - migrate:fresh:
        --force: true
    - db:seed:
        --class: Workbench\App\Seeders\DatabaseSeeder
        --force: true
  discovers:
    views: true

providers:
  - Inertia\ServiceProvider
  - Bambamboole\LaravelI18Next\I18NextServiceProvider
  - Lattice\Lattice\LatticeServiceProvider
  - Lattice\Media\MediaServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider
